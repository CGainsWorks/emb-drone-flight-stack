name: firmware

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  host-tests:
    name: Host unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      - name: Build and run tests
        working-directory: firmware
        run: ./run_tests.sh clean

      - name: Test summary
        working-directory: firmware
        run: ./test_summary.sh

  firmware-image:
    name: Cross-compile STM32F405 image
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Build firmware
        working-directory: firmware
        run: ./build_firmware.sh clean

      # Linking is a weak claim on its own; this checks the image is actually
      # well formed (vector table placement, stack pointer, interrupt wiring).
      - name: Verify linked image
        working-directory: firmware
        run: ./verify_image.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fc_firmware
          path: |
            firmware/build-arm/fc_firmware.elf
            firmware/build-arm/fc_firmware.bin
            firmware/build-arm/fc_firmware.hex
            firmware/build-arm/fc_firmware.map
