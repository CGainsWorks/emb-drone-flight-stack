name: firmware

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - 'tools/**'
      - 'test-results/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - 'tools/**'
      - 'test-results/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Arm GNU Toolchain, the Arm-published arm-none-eabi build (not the distro
  # package), pinned by version and checksum.
  ARM_GNU_VERSION: 13.3.rel1
  ARM_GNU_SHA256: 95c011cee430e64dd6087c75c800f04b9c49832cc1000127a92a97f9c8d83af4
  # Renode release used to run the real firmware image on an emulated STM32F4.
  RENODE_VERSION: 1.16.1
  RENODE_SHA256: 00e113cdbd0f5354cf2f64bbe3f5a070d8958409542fca66e45ac97d982938c0

jobs:
  host-tests:
    name: Host tests and SIL stability gate
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build and run tests
        working-directory: firmware
        run: ./run_tests.sh clean

      - name: Test summary
        working-directory: firmware
        run: ./test_summary.sh

      # Everything below is simulated: the firmware closed around an assumed
      # quadrotor model on the host. No hardware is involved.
      - name: SIL step responses (simulated)
        run: python3 tools/pid_tuner.py run --out firmware/build/sil

      - name: SIL stability gate and drift check against committed results
        run: >
          python3 tools/pid_tuner.py check firmware/build/sil/metrics.json
          --reference test-results/sil/metrics.json

      - name: SIL stability gate on a slower, heavier plant
        run: firmware/build/fc_sil --check --motor-tau 0.045 --inertia-scale 1.3

      - name: Upload simulated SIL results
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sil-results-simulated
          path: firmware/build/sil

  firmware-image:
    name: Cross-compile and run on Renode
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Cache Arm GNU Toolchain
        id: arm-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/arm-gnu
          key: arm-gnu-${{ env.ARM_GNU_VERSION }}-x86_64

      - name: Install Arm GNU Toolchain
        if: steps.arm-cache.outputs.cache-hit != 'true'
        run: |
          name=arm-gnu-toolchain-${ARM_GNU_VERSION}-x86_64-arm-none-eabi
          curl -fsSL -o /tmp/arm.tar.xz \
            "https://developer.arm.com/-/media/Files/downloads/gnu/${ARM_GNU_VERSION}/binrel/${name}.tar.xz"
          echo "${ARM_GNU_SHA256}  /tmp/arm.tar.xz" | sha256sum -c -
          mkdir -p ~/arm-gnu
          tar -xf /tmp/arm.tar.xz -C ~/arm-gnu --strip-components=1

      - name: Put the toolchain on PATH
        run: |
          echo "$HOME/arm-gnu/bin" >> "$GITHUB_PATH"
          "$HOME/arm-gnu/bin/arm-none-eabi-gcc" --version | head -1

      - name: Build firmware
        working-directory: firmware
        run: ./build_firmware.sh clean

      # Linking is a weak claim on its own; this checks the image is actually
      # well formed (vector table placement, stack pointer, interrupt wiring).
      - name: Verify linked image
        working-directory: firmware
        run: ./verify_image.sh

      - name: Cache Renode
        id: renode-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/renode
          key: renode-${{ env.RENODE_VERSION }}-portable-dotnet

      - name: Install Renode
        if: steps.renode-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/renode.tar.gz \
            "https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable-dotnet.tar.gz"
          echo "${RENODE_SHA256}  /tmp/renode.tar.gz" | sha256sum -c -
          mkdir -p ~/renode
          tar -xzf /tmp/renode.tar.gz -C ~/renode --strip-components=1

      - name: Install Renode test dependencies
        run: |
          python3 -m venv ~/renode-venv
          ~/renode-venv/bin/pip install -q -r ~/renode/tests/requirements.txt

      # Boots the real fc_firmware.elf on Renode's STM32F4 platform with a
      # simulated ICM-42688-P on the bit-banged SPI lines. Emulated, not silicon.
      - name: Run the firmware on Renode (emulated)
        working-directory: firmware
        run: |
          source ~/renode-venv/bin/activate
          ~/renode/renode-test sim/renode/fc_firmware.robot -r build-arm/renode

      - name: Upload firmware and Renode logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fc_firmware
          path: |
            firmware/build-arm/fc_firmware.elf
            firmware/build-arm/fc_firmware.bin
            firmware/build-arm/fc_firmware.hex
            firmware/build-arm/fc_firmware.map
            firmware/build-arm/renode
